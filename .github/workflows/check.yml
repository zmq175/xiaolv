name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: tester
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: xiaolv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tester -d xiaolv_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      XIAOLV_TEST_DATABASE_URL: postgresql+psycopg://tester:local-ci-only@127.0.0.1:5432/xiaolv_test
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.12.7"
      - run: uv sync --locked
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --prefix dashboard
      - run: npm run format:check --prefix dashboard
      - run: npm run build --prefix dashboard
      - run: uv run playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - name: Behavior and PostgreSQL integration tests
        run: uv run pytest
