name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.12.7"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - name: Behavior tests
        shell: bash
        run: |
          if rg --files tests -g 'test_*.py' | rg -q .; then
            uv run pytest
          else
            echo 'Bootstrap only: no behavior tests yet; no behavioral validation claimed.'
          fi
