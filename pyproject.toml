[project]
name = "xiaolv"
version = "0.0.0"
description = "A social conversational agent with native IM adapters"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1,<2",
    "anyio>=4,<5",
    "fastapi>=0.115,<1",
    "fish-audio-sdk==1.3.0",
    "httpx>=0.27.2,<1",
    "httpx2>=2,<3",
    "langgraph>=1,<2",
    "openai>=3,<4",
    "opentelemetry-api>=1,<2",
    "opentelemetry-sdk>=1,<2",
    "pillow>=12,<13",
    "psycopg[binary]>=3,<4",
    "pwdlib[argon2]>=0.3,<1",
    "pydantic>=2,<3",
    "sqlalchemy[asyncio]>=2,<3",
    "tavily-python>=0.7,<1",
    "tiktoken>=0.12,<1",
    "uvicorn>=0.35,<1",
    "websockets>=16,<17",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
    "mypy>=1.15,<2",
    "playwright>=1.58,<2",
]

[tool.uv]
package = false
required-version = "==0.12.7"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
